kind = "web"
previewPath = "/"
title = "Wash & Ryde"
description = "A premium, conversion-focused website for Wash & Ryde car wash, detailing, paint correction, and ceramic coating services in Ryde, NSW."
version = "1.0.0"
id = "artifacts/wash-and-ryde"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20257

[services.development]
run = "pnpm --filter @workspace/wash-and-ryde run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wash-and-ryde", "run", "build" ]
serve = "static"
publicDir = "artifacts/wash-and-ryde/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20257"
BASE_PATH = "/"
